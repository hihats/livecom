services:
  backend:
    build:
      context: ./backend
    container_name: livecom-backend
    ports:
      - "8000:8000"
    environment:
      - WHISPER_SERVICE_URL=http://host.docker.internal:9000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=sqlite:///data/livecom.db
    volumes:
      - ./backend:/app
      - livecom-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: livecom-frontend
    ports:
      - "5173:80"
    profiles:
      - prod

volumes:
  livecom-data:
